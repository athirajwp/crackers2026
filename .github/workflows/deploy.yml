name: Deploy to Hostinger

on:
  push:
    branches:
      - main  # Auto-deploy whenever you push to main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Deploy via rsync (preserves uploads & database)
        env:
          DEPLOY_USER: ${{ secrets.HOSTINGER_USER }}
          DEPLOY_HOST: ${{ secrets.HOSTINGER_HOST }}
          DEPLOY_PORT: ${{ secrets.HOSTINGER_PORT }}
          DEPLOY_PATH: ${{ secrets.HOSTINGER_PATH }}
        run: |
          CLEAN_PATH="$(echo -n "$DEPLOY_PATH" | tr -d '\r\n')"
          rsync -avz --progress \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='frontend/node_modules' \
            --exclude='backend/vendor.zip' \
            --exclude='backend/public/uploads' \
            --exclude='backend/database/database.sqlite' \
            --exclude='backend/storage/logs' \
            --exclude='backend/.env' \
            -e "ssh -p $DEPLOY_PORT -o StrictHostKeyChecking=no" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${CLEAN_PATH}/"

